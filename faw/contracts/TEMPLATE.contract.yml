# Data contract: template
#
# One file per curated table, at contracts/<schema>.<table>.yml
#
# This is the input of the `schema` gate: scripts/verify_contract.py compares the
# real schema of the written table against this declaration, column by column.
# What is not declared here cannot be verified, and what is not verified is what
# gets published with 11 of 23 columns without anyone noticing.

table: core.dim_example
layer: gold                     # bronze | silver | gold
lakehouse: LH_XXX_Gold

# One sentence: "one row per ___". If it cannot be written that way, the grain has
# not been decided.
grain: one row per calendar day

# Verified during PROFILING with a total count against a distinct count. Not
# copied from a specification.
natural_key: [date_key]

# Where it comes from. For traceability; the verifier does not use it.
source:
  - description: generated by sequence, not ingested
    tables: []

# How it is written. The verifier does not use this; it is declared so that the
# artifact and the contract do not contradict each other.
write:
  mode: overwrite               # overwrite | idempotent_append | upsert
  allow_schema_change: false    # false for dimensions with a deterministic key
  snapshot_column: null         # only when mode = idempotent_append

# ---------------------------------------------------------------------------
# Columns. This is what the `schema` gate verifies.
#
#   name        required
#   type        required: int, bigint, string, date, timestamp, double,
#               decimal(p,s), boolean
#   nullable    required: true | false
#   description optional but recommended
# ---------------------------------------------------------------------------
columns:
  - name: date_key
    type: int
    nullable: false
    description: Key in yyyyMMdd format. Deterministic.

  - name: date
    type: date
    nullable: false
    description: Join column with the fact tables.

  - name: year
    type: int
    nullable: false

  - name: is_unknown
    type: boolean
    nullable: false
    description: Marks the sentinel row of the Unknown member.

# ---------------------------------------------------------------------------
# Quality rules. The verifier runs them against the real table when given a
# connection; otherwise they stand as documentation of what should be checked.
# ---------------------------------------------------------------------------
quality:
  # The natural key has no duplicates. This should always be present.
  - rule: uniqueness
    columns: [date_key]

  # No foreign key is left null: without a match it goes to the Unknown member.
  - rule: no_nulls
    columns: [date_key, date]

  # Expected number of rows, exact or with tolerance.
  - rule: rows
    min: 4000
    max: 4100

  # Heuristic for silent truncation: if the count lands on an exactly round number
  # (1000, 5000, 10000, or 20, the default of an interactive display), it is
  # suspicious even when it falls inside the range declared above. This is not an
  # automatic error; it is a signal for a human to look before accepting the run.

  # Maximum acceptable percentage of a sentinel value. Above it, the rule fails.
  # It makes a worsening source problem visible.
  - rule: max_pct
    column: date
    value: '1900-01-01'
    pct: 1.0

  # Closed domain.
  - rule: domain
    column: is_unknown
    values: [true, false]

# ---------------------------------------------------------------------------
# What breaks if this table changes. Filled in during DESIGN and read before
# touching it again.
# ---------------------------------------------------------------------------
consumers:
  - type: table
    name: core.dim_example_role
    note: derived by a parameterized function; follows the schema of this one
  - type: semantic_model
    name: SM_Example
    note: consumes date and year

# ---------------------------------------------------------------------------
# Decisions that have to be explainable six months from now. One line each.
# ---------------------------------------------------------------------------
decisions:
  - id: D1
    text: Meaningful key (yyyyMMdd) instead of a surrogate. This is the recognized exception for date dimensions.
  - id: D2
    text: Sentinel row for unknown dates, instead of leaving foreign keys null.

# Open business questions. These do NOT go to a surface the recipient of the
# repository reads: they stay in the internal tracker and only the reference goes
# here.
open_questions:
  - None.
