# Contrato de datos — plantilla
#
# Un archivo por tabla de Silver y Gold, en contratos/<esquema>.<tabla>.yml
#
# Es la entrada de la compuerta `esquema`: scripts/verificar_contrato.py compara
# el esquema real de la tabla escrita contra esta declaración, columna por columna.
# Si no está declarado acá, no se puede verificar — y lo que no se verifica es lo
# que se publica con 11 de 23 columnas sin que nadie se entere.

tabla: core.dim_ejemplo
capa: gold                      # bronze | silver | gold
lakehouse: LH_XXX_Gold

# Una frase. "Una fila por ___". Si no se puede escribir así, el grano no está decidido.
grano: una fila por día calendario

# Verificada en PERFILADO con count(*) contra count(distinct). No copiada de una ficha.
clave_natural: [fecha_key]

# De dónde sale. Para trazabilidad, no lo usa el verificador.
origen:
  - descripcion: generada por secuencia, no ingerida
    tablas: []

# Cómo se escribe. El verificador no lo usa; queda declarado para que el artefacto
# y el contrato no se contradigan.
escritura:
  modo: overwrite               # overwrite | append_idempotente | upsert
  permitir_cambio_schema: false # false en dimensiones con clave determinística
  columna_snapshot: null        # solo si modo = append_idempotente

# ---------------------------------------------------------------------------
# Columnas. Esto es lo que verifica la compuerta `esquema`.
#
#   nombre     obligatorio
#   tipo       obligatorio — tipo Spark: int, bigint, string, date, timestamp,
#              double, decimal(p,s), boolean
#   nulable    obligatorio — true | false
#   descripcion  opcional pero recomendada
# ---------------------------------------------------------------------------
columnas:
  - nombre: fecha_key
    tipo: int
    nulable: false
    descripcion: Clave en formato yyyyMMdd. Determinística.

  - nombre: fecha
    tipo: date
    nulable: false
    descripcion: Columna de join con los facts.

  - nombre: anio
    tipo: int
    nulable: false

  - nombre: es_desconocido
    tipo: boolean
    nulable: false
    descripcion: Marca la fila centinela del miembro Desconocido.

# ---------------------------------------------------------------------------
# Reglas de calidad. El verificador las corre contra la tabla real si se le pasa
# una conexión; si no, quedan como documentación de qué habría que chequear.
# ---------------------------------------------------------------------------
calidad:
  # La clave natural no tiene duplicados. Siempre debería estar.
  - regla: unicidad
    columnas: [fecha_key]

  # Ninguna FK queda nula: sin match va al miembro Desconocido.
  - regla: sin_nulos
    columnas: [fecha_key, fecha]

  # Cantidad de filas esperada, exacta o con tolerancia.
  - regla: filas
    minimo: 4000
    maximo: 4100

  # Heurística de truncamiento silencioso: si el conteo da un número exactamente
  # redondo (1000, 5000, 10000, o 20 — el default de display() de Spark), es
  # sospechoso de truncamiento aunque caiga dentro del rango declarado arriba.
  # No es un error automático — el verificador no falla solo por esto — es una
  # señal para que un humano lo mire antes de dar la corrida por buena.

  # Porcentaje máximo aceptable de un valor centinela. Por encima, falla.
  # Sirve para que un problema de origen que empeora se note.
  - regla: pct_maximo
    columna: fecha
    valor: '1900-01-01'
    pct: 1.0

  # Dominio cerrado.
  - regla: dominio
    columna: es_desconocido
    valores: [true, false]

# ---------------------------------------------------------------------------
# Qué se rompe si esta tabla cambia. Se completa en DISEÑO y se lee antes de
# tocarla de nuevo.
# ---------------------------------------------------------------------------
consumidores:
  - tipo: tabla
    nombre: core.dim_ejemplo_rol
    nota: derivada por función parametrizada; sigue el esquema de esta
  - tipo: modelo_semantico
    nombre: SM_Ejemplo
    nota: consume fecha y anio

# ---------------------------------------------------------------------------
# Decisiones que hay que poder explicar dentro de seis meses. Una línea cada una.
# ---------------------------------------------------------------------------
decisiones:
  - id: D1
    texto: Clave con significado (yyyyMMdd) en vez de subrogada. Es la excepción reconocida para dimensiones de fecha.
  - id: D2
    texto: Fila centinela para fechas desconocidas, en vez de dejar FKs nulas.

# Preguntas de negocio sin cerrar. NO van a superficie que lea el destinatario
# del repo: quedan en el tracker interno y acá va solo la referencia.
abiertas:
  - Ninguna.
